name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile caller/*.py scripts/*.py tests/*.py
      - name: Recording-notice silence (no API keys, no calls)
        run: python tests/test_recording_notice.py
      - name: end_call guard (no API keys, no calls)
        run: python tests/test_end_call_guard.py
